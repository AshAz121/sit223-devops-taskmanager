global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: sit223-taskmanager
    metrics_path: /metrics
    static_configs:
      - targets:
          - sit223-taskmanager-production:5000
